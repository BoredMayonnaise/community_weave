name: Build Mobile Apps (Android APK & iOS)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Web App & Sync Capacitor Android
        working-directory: frontend
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: community-weave-android-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Web App & Sync Capacitor iOS
        working-directory: frontend
        run: |
          npm run build
          npx cap sync ios

      - name: Build iOS App (Unsigned)
        working-directory: frontend/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            clean build

      - name: Archive iOS App (Zip & IPA)
        working-directory: frontend/ios/App
        run: |
          mkdir -p build-output
          APP_PATH=""
          if [ -d "build/Build/Products/Debug-iphoneos/App.app" ]; then
            APP_PATH="build/Build/Products/Debug-iphoneos/App.app"
          elif [ -d "build/Debug-iphoneos/App.app" ]; then
            APP_PATH="build/Debug-iphoneos/App.app"
          fi

          if [ -n "$APP_PATH" ]; then
            # 1. Zip archive for development / simulator
            APP_DIR=$(dirname "$APP_PATH")
            (cd "$APP_DIR" && zip -r ../../../../build-output/CommunityWeave-iOS-Debug.zip App.app)

            # 2. Native IPA package (Payload folder structure) for direct sideloading (AltStore / TrollStore / Sideloadly)
            rm -rf /tmp/payload-wrap && mkdir -p /tmp/payload-wrap/Payload
            cp -R "$APP_PATH" /tmp/payload-wrap/Payload/
            (cd /tmp/payload-wrap && zip -r "$GITHUB_WORKSPACE/frontend/ios/App/build-output/CommunityWeave-iOS-Debug.ipa" Payload)
          fi

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: community-weave-ios-app
          path: |
            frontend/ios/App/build-output/*.zip
            frontend/ios/App/build-output/*.ipa
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: community-weave-android-apk
          path: release-downloads/android

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: community-weave-ios-app
          path: release-downloads/ios

      - name: Prepare Release Assets
        run: |
          mkdir -p release-binaries
          cp release-downloads/android/app-debug.apk release-binaries/CommunityWeave-Android-${{ github.ref_name }}.apk
          if [ -f "release-downloads/ios/CommunityWeave-iOS-Debug.ipa" ]; then
            cp release-downloads/ios/CommunityWeave-iOS-Debug.ipa release-binaries/CommunityWeave-iOS-${{ github.ref_name }}.ipa
          fi
          if [ -f "release-downloads/ios/CommunityWeave-iOS-Debug.zip" ]; then
            cp release-downloads/ios/CommunityWeave-iOS-Debug.zip release-binaries/CommunityWeave-iOS-${{ github.ref_name }}.zip
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-binaries/*
          generate_release_notes: true

