<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Background Aura -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>

    <!-- Ribbon 1: Luminous Emerald / Teal -->
    <linearGradient id="tealRibbon" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Ribbon 2: Warm Amber / Coral -->
    <linearGradient id="warmRibbon" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Ribbon 3: Electric Indigo / Violet -->
    <linearGradient id="violetRibbon" x1="30%" y1="80%" x2="70%" y2="20%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Realistic drop shadows for 3D interlocking weave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Aura light -->
  <circle cx="256" cy="256" r="220" fill="url(#aura)" />
  <!-- Sleek border outline -->
  <rect x="4" y="4" width="504" height="504" rx="124" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Central Intertwined Community Weave Motif -->
  <!-- Loop 1 (Teal): Gentle figure-8 / community loop -->
  <path d="M 170 180 C 130 220, 130 292, 170 332 C 210 372, 270 350, 310 310 L 350 270 C 390 230, 390 158, 350 118 C 310 78, 250 100, 210 140 Z"
        stroke="url(#tealRibbon)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)" />

  <!-- Loop 2 (Amber/Coral): Counter-balancing weave passing under and over -->
  <path d="M 342 180 C 382 220, 382 292, 342 332 C 302 372, 242 350, 202 310 L 162 270 C 122 230, 122 158, 162 118 C 202 78, 262 100, 302 140 Z"
        stroke="url(#warmRibbon)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)" />

  <!-- Center Bridge Accent (Violet Core Weave Link) -->
  <circle cx="256" cy="225" r="18" fill="url(#violetRibbon)" filter="url(#softGlow)" />
  <circle cx="256" cy="225" r="8" fill="#ffffff" opacity="0.9" />

  <!-- Connection Nodes (representing connected neighbors) -->
  <circle cx="170" cy="180" r="14" fill="#5eead4" filter="url(#softGlow)" />
  <circle cx="342" cy="180" r="14" fill="#fbbf24" filter="url(#softGlow)" />
  <circle cx="170" cy="332" r="14" fill="#2dd4bf" filter="url(#softGlow)" />
  <circle cx="342" cy="332" r="14" fill="#f43f5e" filter="url(#softGlow)" />
</svg>
