<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background: Midnight Forest / Deep Modern Teal -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="40%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Warm Amber to Coral Ribbon -->
    <linearGradient id="warmRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Teal to Soft Mint Ribbon -->
    <linearGradient id="mintRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ccfbf1" />
      <stop offset="70%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Realistic drop shadow for overlapping weave threads -->
    <filter id="threadShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#022c22" flood-opacity="0.5" />
    </filter>

    <!-- Clip path to isolate the center crossover of the warm ribbon -->
    <clipPath id="centerClip">
      <rect x="44" y="40" width="32" height="35" />
    </clipPath>
  </defs>

  <!-- Container Squircle with subtle depth -->
  <rect width="120" height="120" rx="32" fill="url(#bg)" />
  <rect x="1.5" y="1.5" width="117" height="117" rx="30.5" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- 1. Warm Ribbon (Full Base) -->
  <path d="M 22 62 C 30 42, 38 42, 46 54 C 54 66, 66 66, 74 54 C 82 42, 90 42, 98 62"
        stroke="url(#warmRibbon)" stroke-width="11" stroke-linecap="round" fill="none" />

  <!-- 2. Full Continuous Mint 'W' Ribbon (Naturally passes OVER left & right of warm ribbon) -->
  <path d="M 27 38 C 29 58, 35 78, 44 78 C 51 78, 56 60, 60 48 C 64 60, 69 78, 76 78 C 85 78, 91 58, 93 38"
        stroke="url(#mintRibbon)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#threadShadow)" />

  <!-- 3. Center Section of Warm Ribbon (Clipped to center box, passing OVER the center of 'W') -->
  <g clip-path="url(#centerClip)">
    <path d="M 22 62 C 30 42, 38 42, 46 54 C 54 66, 66 66, 74 54 C 82 42, 90 42, 98 62"
          stroke="url(#warmRibbon)" stroke-width="11" stroke-linecap="round" fill="none" filter="url(#threadShadow)" />
  </g>
</svg>
